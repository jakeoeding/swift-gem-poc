name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  ci:
    name: CI (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Setup Swift
        uses: swift-actions/setup-swift@v2
        with:
          swift-version: "6.2"

      - name: Setup Ruby
        uses: ruby/setup-ruby@v1
        with:
          ruby-version: "3.1"
          bundler-cache: true

      - name: Set SDKRoot (macOS)
        if: matrix.os == 'macos-latest'
        run: echo "SDKROOT=$(xcrun --show-sdk-path)" >> $GITHUB_ENV

      - name: Build gem
        run: gem build swift_counter.gemspec

      - name: Install gem
        run: gem install swift_counter

      - name: Smoke test
        run: echo "c = SwiftCounter::Counter.new; c.increment; c.count == 1" | bin/console
